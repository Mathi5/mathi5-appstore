name: Release image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push the vdirsyncer image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the tag
        id: meta
        run: |
          # GHCR requires a lowercase owner. ${{ github.repository_owner }}
          # returns the owner's login AS DISPLAYED ("Mathi5") — lowercase it.
          OWNER="$(echo "${IMAGE_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "tags=ghcr.io/${OWNER}/vdirsyncer-image:${VERSION},ghcr.io/${OWNER}/vdirsyncer-image:latest" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
            echo "tags=ghcr.io/${OWNER}/vdirsyncer-image:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: images/vdirsyncer
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VDIRSYNCER_VERSION=0.21.0
          labels: |
            org.opencontainers.image.title=vdirsyncer-image
            org.opencontainers.image.description=vdirsyncer with the google extra (aiohttp-oauthlib)
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

      - name: Report the package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_OWNER: ${{ steps.meta.outputs.owner }}
          PACKAGE_NAME: vdirsyncer-image
          VERSION: ${{ steps.meta.outputs.version }}
        # The GITHUB_TOKEN cannot PATCH the visibility of a user-scoped
        # package (it 404s). The package is created from a PUBLIC repo, so it
        # inherits that visibility — this step only REPORTS the state, and
        # fails loudly if an anonymous pull would not work.
        run: |
          status=$(gh api "/users/${PACKAGE_OWNER}/packages/container/${PACKAGE_NAME}" --jq '.visibility // empty' 2>/dev/null || echo "")
          echo "package visibility: ${status:-unknown}"
          TOKEN=$(curl -s "https://ghcr.io/token?service=ghcr.io&scope=repository:${PACKAGE_OWNER}/${PACKAGE_NAME}:pull" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          if [ -n "$TOKEN" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${TOKEN}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json' \
              "https://ghcr.io/v2/${PACKAGE_OWNER}/${PACKAGE_NAME}/manifests/${VERSION:-latest}")
            echo "anonymous manifest probe: HTTP ${code}"
            if [ "$code" != "200" ]; then
              echo "::error::The image is NOT anonymously pullable (HTTP ${code})."
              echo "::error::Set the package to public: https://github.com/users/${PACKAGE_OWNER}/packages/container/${PACKAGE_NAME}/settings"
              exit 1
            fi
          else
            echo "::error::No anonymous pull token — the package is not public."
            echo "::error::Set the package to public: https://github.com/users/${PACKAGE_OWNER}/packages/container/${PACKAGE_NAME}/settings"
            exit 1
          fi
