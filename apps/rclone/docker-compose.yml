x-runtipi:
  schema_version: 2

services:
  rclone:
    image: rclone/rclone:1.75.2
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        # The image's default entrypoint is `rclone`. This app runs a small
        # shell loop instead, so `rclone serve webdav` can stay up while
        # rclone is driven by `docker exec` (see the app description).
        #
        # `$$` keeps the shell expansion for the container's shell: docker
        # compose turns `$$` into a literal `$`, so the container's shell
        # expands the variable at runtime. A bare `${VAR}` would be
        # interpolated by compose at parse time instead.
        if [ -n "$${RCLONE_SERVE_REMOTE}" ]; then
          echo "Serving remote '$${RCLONE_SERVE_REMOTE}' over WebDAV on port $${RCLONE_SERVE_PORT}"
          rclone serve webdav "$${RCLONE_SERVE_REMOTE}:$${RCLONE_SERVE_PATH}" \
            --addr ":$${RCLONE_SERVE_PORT}" \
            --user "$${RCLONE_SERVE_USER}" \
            --pass "$${RCLONE_SERVE_PASS}" \
            --vfs-cache-mode off &
        else
          echo "No remote to serve. Set the 'Remote to serve over WebDAV' field and restart the app."
        fi
        # Keep the container alive so the WebDAV server stays up.
        while true; do
          sleep 3600
        done
    environment:
      - RCLONE_CONFIG=${RCLONE_CONFIG_PATH}
      - RCLONE_SERVE_REMOTE=${RCLONE_SERVE_REMOTE}
      - RCLONE_SERVE_PORT=${RCLONE_SERVE_PORT}
      - RCLONE_SERVE_USER=${RCLONE_SERVE_USER}
      - RCLONE_SERVE_PASS=${RCLONE_SERVE_PASS}
      - RCLONE_SERVE_PATH=${RCLONE_SERVE_PATH}
      - TZ=${TZ}
    volumes:
      # The rclone config holds the OAuth tokens — it must live on a volume.
      - ${APP_DATA_DIR}/config:/config
      # The directory rclone is pointed at by the backup jobs.
      - ${APP_DATA_DIR}/data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - "rclone version > /dev/null 2>&1 || exit 1"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    x-runtipi:
      is_main: true
      internal_port: 5572
