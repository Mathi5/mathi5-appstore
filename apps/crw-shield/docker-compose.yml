services:
  crw-shield:
    image: ghcr.io/mathi5/crw-shield:0.4.5
    restart: unless-stopped
    environment:
      - RUST_LOG=info
      - HOST=0.0.0.0
      - PORT=3002
      - TZ=${TZ}
      # Public URL for operator-facing links (Discord "solve in browser"
      # button). When unset, the server falls back to HOST:PORT — fine for
      # localhost access, broken for Discord clicks from outside the LAN.
      # Set to the same value users type in their browser to reach the
      # server, e.g. http://192.168.1.42:3002 or https://crw.example.com
      - CRW_PUBLIC_URL=${CRW_PUBLIC_URL}
      # Auth bearer (optional but recommended)
      - AUTH_TOKEN=***
      # SearXNG (optional — /v2/search endpoint; empty URL returns empty
      # results with a warning, not an error)
      - SEARXNG_URL=${SEARXNG_URL}
      - SEARXNG_TOKEN=***
      # FlareSolverr opt-in per-host allowlist (Pitfall 17: forcing FS globally
      # regresses cloudflare.com 8385→502). Leave FLARESOLVERR_URL or
      # FLARESOLVERR_HOSTS blank to disable FS entirely.
      - FLARESOLVERR_URL=${FLARESOLVERR_URL}
      - FLARESOLVERR_HOSTS=${FLARESOLVERR_HOSTS}
      # TLS-impersonation-proxy (Phase 1, opt-in)
      - TLS_PROXY_ENABLED=${TLS_PROXY_ENABLED}
      - TLS_PROXY_LISTEN=127.0.0.1:7890
      - TLS_PROXY_PROFILE=chrome_120
      - TLS_PROXY_PROFILES=chrome_120,chrome_117,chrome_107,firefox_117,safari_16_0
      - TLS_PROXY_ROTATION_DELAY_SECS=3
      - TLS_PROXY_CA_DIR=/var/lib/crw-shield/tls-ca
      - TLS_PROXY_BYPASS=localhost,127.0.0.1,::1
      - TLS_PROXY_TIMEOUT_SECS=60
      # Browser profile warming (disabled — see crates/fetch/src/cdp.rs for
      # the chromiumoxide Browser lifecycle issue).
      - CRW_WARMUP_ENABLED=false
      # Rate limiter (matches cortex-bridge defaults: 2000ms min + 500ms jitter)
      - RATE_LIMIT_MIN_MS=${RATE_LIMIT_MIN_MS}
      - RATE_LIMIT_JITTER_MS=${RATE_LIMIT_JITTER_MS}
      # HITL cookie persistence + Discord notification (new in 0.3.0).
      # The cookie jar is reloaded from this file at startup and snapshotted
      # back every 60s, so cf_clearance and friends survive container
      # restarts. Empty COOKIE_PERSISTENCE_PATH = in-memory only.
      - COOKIE_PERSISTENCE_PATH=${COOKIE_PERSISTENCE_PATH}
      # Set to a Discord webhook URL to get pinged every time an HITL
      # challenge is auto-enqueued (challenge kind + URL + id + ready-to-
      # paste solve curl). Empty = no notifications.
      - DISCORD_WEBHOOK_HITL_URL=${DISCORD_WEBHOOK_HITL_URL}
      # NEW in v0.4.4: reuse an external Chrome instance over CDP instead
      # of bundling Chromium. Set to ws://chrome-mcp-host:9223 (or
      # http://chrome-mcp-host:9223 — the WS URL is auto-resolved via
      # GET /json/version). Leave blank for default behaviour
      # (chromiumoxide spawns its own Chromium).
      - CRW_CDP_REMOTE_URL=${CRW_CDP_REMOTE_URL}
    volumes:
      - crw-shield-tls-ca:/var/lib/crw-shield/tls-ca
      # Persistent cookie jar (survives container restarts).
      # IMPORTANT: bind-mount the *directory*, not a file path — Docker
      # cannot create a file inside a named volume, only a directory,
      # which would break the binaire's atomic rename (.tmp -> cookies.json)
      # with EISDIR. The server writes /var/lib/crw-shield/cookies.json
      # inside this directory.
      # Note: on upgrade from v0.4.0, the old crw-shield-cookies volume
      # contains a leftover cookies.json/ directory. Re-create the volume
      # (Settings → App data → Reset) or rename the volume before upgrading
      # — otherwise you'll see two side-by-side folders (cookies.d and
      # cookies.json), harmless but confusing.
      - crw-shield-cookies:/var/lib/crw-shield/cookies.d
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    x-runtipi:
      is_main: true
      internal_port: 3002

volumes:
  crw-shield-tls-ca: {}
  crw-shield-cookies: {}

x-runtipi:
  schema_version: 2