x-runtipi:
  schema_version: 2

services:
  playwright-service:
    image: ghcr.io/firecrawl/playwright-service:latest
    environment:
      - PORT=3000
      - MAX_CONCURRENT_PAGES=10
      # Playwright SSRF-proxy chain: release the private-host guard so the
      # browser contexts may be routed through an antibot proxy on a private
      # network (Trawl forward proxy). Upstream parses "TRUE" case-insensitive.
      - ALLOW_LOCAL_WEBHOOKS=${ALLOW_LOCAL_WEBHOOKS}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        compress: "true"
    restart: unless-stopped

  api:
    image: ghcr.io/firecrawl/firecrawl:2.11.3
    command: node dist/src/harness.js --start-docker
    environment:
      - REDIS_URL=redis://redis:6379
      - REDIS_RATE_LIMIT_URL=redis://redis:6379
      - PLAYWRIGHT_MICROSERVICE_URL=http://playwright-service:3000/scrape
      - NUQ_RABBITMQ_URL=amqp://rabbitmq:5672
      - POSTGRES_HOST=nuq-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
      - USE_DB_AUTHENTICATION=false
      - TEST_API_KEY=${TEST_API_KEY}
      - BULL_AUTH_KEY=${BULL_AUTH_KEY}
      - NUM_WORKERS_PER_QUEUE=8
      - CRAWL_CONCURRENT_REQUESTS=10
      - MAX_CONCURRENT_JOBS=5
      - BROWSER_POOL_SIZE=5
      - HARNESS_STARTUP_TIMEOUT_MS=60000
      - ENV=local
      - HOST=0.0.0.0
      - PORT=3002
      - EXTRACT_WORKER_PORT=3004
      - WORKER_PORT=3005
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MODEL_NAME=${MODEL_NAME}
      # Worker backpressure: workers refuse new jobs when host CPU or RAM
      # exceeds MAX_CPU/MAX_RAM (ratios 0-1, upstream defaults 0.8; read via
      # z.coerce.number — an EMPTY string coerces to 0, so the :- default
      # guards both unset and empty values).
      - MAX_CPU=${MAX_CPU:-0.8}
      - MAX_RAM=${MAX_RAM:-0.8}
      # Upstream disables the search backend when SEARXNG_ENDPOINT is empty
      # (checked in apps/api/src/search/index.ts). A blank URL field = search
      # off; no ${...} interpolation needed in this value.
      - SEARXNG_ENDPOINT=${SEARXNG_ENDPOINT}
      # Optional antibot proxy (e.g. the Trawl app's forward proxy on 8192).
      # Consumed by safeFetch (undici ProxyAgent) for native fetches.
      - PROXY_SERVER=${PROXY_SERVER}
      # SSRF guard release: REQUIRED when PROXY_SERVER points at a private
      # network address (docker hostname like trawl resolves to RFC1918).
      # Upstream boolean parsing: /^(1|true|yes)$/i.
      - ALLOW_LOCAL_WEBHOOKS=${ALLOW_LOCAL_WEBHOOKS}
    extra_hosts:
      - host.docker.internal:host-gateway
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        compress: "true"
    depends_on:
      redis:
        condition: service_started
      playwright-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    x-runtipi:
      is_main: true
      internal_port: 3002

  redis:
    image: redis:alpine
    command: redis-server --bind 0.0.0.0
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
        compress: "true"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    command: rabbitmq-server
    environment:
      - RABBITMQ_ERLANG_COOKIE=firecrawl-store-erlang-cookie-01
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - check_running
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
        compress: "true"
    restart: unless-stopped

  nuq-postgres:
    image: ghcr.io/firecrawl/nuq-postgres:latest
    volumes:
      - ${APP_DATA_DIR}/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        compress: "true"
    restart: unless-stopped